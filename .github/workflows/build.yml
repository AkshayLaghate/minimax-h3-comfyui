name: Build worker image

# Builds the ComfyUI worker image (no models — those live on the network volume)
# and pushes it to GHCR.
#
# Two-step build: the published runpod/worker-comfyui base tags all predate
# ComfyUI v0.30.0, which is the release that added MiniMax H3. So we build
# upstream's `base` target ourselves from a pinned SHA with COMFYUI_VERSION
# overridden, then stack our thin overlay on top.

on:
  workflow_dispatch:
    inputs:
      comfyui_version:
        description: "ComfyUI version (>= 0.30.0 for MiniMax H3)"
        default: "0.30.0"
      tag:
        description: "Image tag"
        default: "0.1.0"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "extra_model_paths.yaml"
      - ".github/workflows/build.yml"

env:
  # worker-comfyui pinned so a future upstream commit cannot silently change the
  # base out from under a rebuild.
  WORKER_SHA: a1981e99b1f5a7201f387653420ad1f275b97d0a
  IMAGE: ghcr.io/${{ github.repository_owner }}/minimax-h3-comfyui

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The base image is ~11 GiB and the runner ships with only ~21 GB free.
      # Reclaiming the preinstalled toolchains buys ~25 GB, which is the
      # difference between this building and dying on ENOSPC.
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "after:"; df -h / | tail -1

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout worker-comfyui (pinned)
        uses: actions/checkout@v4
        with:
          repository: runpod-workers/worker-comfyui
          ref: ${{ env.WORKER_SHA }}
          path: worker-comfyui

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upstream's own Dockerfile runs `python main.py --quick-test-for-ci --cpu`
      # as a build step, so a startup-breaking dependency fails here rather than
      # on a live GPU worker.
      - name: Build worker-comfyui base with ComfyUI ${{ inputs.comfyui_version || '0.30.0' }}
        run: |
          docker build \
            --target base \
            --build-arg COMFYUI_VERSION=${{ inputs.comfyui_version || '0.30.0' }} \
            -t worker-comfyui-base:local \
            worker-comfyui

      - name: Verify MiniMax H3 nodes are present
        run: |
          docker run --rm --entrypoint sh worker-comfyui-base:local -c \
            'test -f /comfyui/comfy_extras/nodes_minimax_h3.py' \
            && echo "OK: nodes_minimax_h3.py present"

      - name: Build and push overlay
        run: |
          TAG=${{ inputs.tag || '0.1.0' }}
          docker build \
            --build-arg BASE_IMAGE=worker-comfyui-base:local \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            overlay
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          docker image inspect "$IMAGE:$TAG" --format '{{.Size}}' \
            | awk '{printf "final image: %.1f GiB\n", $1/1024/1024/1024}'
